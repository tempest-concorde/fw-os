u core 1000 "Flight Wall application user" /var/home/core /bin/bash
m core gpio
m core i2c
m core tailscale
# Dedicated group gating USB RTL-SDR receivers (/dev/radio-adsb/rtl-sdr0).
# fw-adsb-readsb runs rootless as core, so core must be a member — mirrors the
# existing gpio/i2c/tailscale pattern.
g adsbrx - -
m core adsbrx
