# Subordinate UID/GID allocation for rootless podman
# Creates user namespace mapping for core user (UID 1000)
# Required for rootless container operation via podman quadlets
#
# Type Path         Mode UID  GID  Age Argument
w      /etc/subuid  -    -    -    -   core:100000:65536
w      /etc/subgid  -    -    -    -   core:100000:65536
# Single-gid range mapping the adsbrx device group (sysusers 50-fw-core.conf)
# into core's userns — required by fw-adsb-readsb GroupAdd=keep-groups.
w      /etc/subgid  -    -    -    -   core:973:1
