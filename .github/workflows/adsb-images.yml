name: ADS-B Feed Images

# Builds the three fw-adsb-* service images introduced by fw-gsd
# specs/003-usb-adsb-feeder (T003). Push happens only via release.yml;
# this workflow proves buildability on every PR (and gates the status
# service's Go quality pipeline).

on:
  pull_request:
    branches: [main]
    paths:
      - 'containers/adsb/**'
      - '.github/workflows/adsb-images.yml'

jobs:
  commitlint:
    name: Lint PR title
    uses: tempest-concorde/fw-cicd/.github/workflows/commitlint.yml@main

  go-quality:
    name: Go quality gates (adsb-status)
    uses: tempest-concorde/fw-cicd/.github/workflows/go-quality.yml@main
    with:
      working_directory: containers/adsb/status/src

  build-readsb:
    name: Build readsb image (no push)
    uses: tempest-concorde/fw-cicd/.github/workflows/build-container.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-readsb
      platform: linux/arm64
      containerfile: containers/adsb/readsb/Containerfile
      push: false
    secrets: inherit

  build-fr24feed:
    name: Build fr24feed image (no push)
    uses: tempest-concorde/fw-cicd/.github/workflows/build-container.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-fr24feed
      platform: linux/arm64
      containerfile: containers/adsb/fr24feed/Containerfile
      push: false
    secrets: inherit

  build-status:
    name: Build status image (no push)
    uses: tempest-concorde/fw-cicd/.github/workflows/build-container.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-status
      platform: linux/arm64
      containerfile: containers/adsb/status/Containerfile
      push: false
    secrets: inherit

  # ---------------------------------------------------------------------
  # Convergence additions (fw-gsd specs/003-usb-adsb-feeder Phase 8).
  # ---------------------------------------------------------------------

  digest-pin-guard:
    name: Digest-pin guard (repo-wide — T008, constitution III)
    # Hard fail while any FROM line in ANY of the repo's Containerfiles is not
    # digest-pinned (root Containerfile, Containerfile.fw-app, the
    # Containerfile.adsb-* sentinels, and everything under containers/adsb/*).
    # T008 extends the original containers/adsb-only list to a repo-wide
    # enumeration; `scratch` stages remain exempt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Fail if any FROM line is not digest-pinned
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r f; do
            while IFS= read -r line; do
              image="${line#FROM }"; image="${image%% *}"
              case "$image" in
                *@sha256:*|scratch) ;;
                *)
                  echo "::error file=${f#./}::FROM does not pin a digest: $line"
                  failures=$((failures+1));;
              esac
            done < <(grep '^FROM ' "$f" || true)
          done < <(find . -maxdepth 4 -name 'Containerfile*' -not -path './.git/*')
          [ "$failures" -eq 0 ] || exit 1

  hadolint:
    name: Lint Containerfiles (T046)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: hadolint readsb
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: containers/adsb/readsb/Containerfile
      - name: hadolint fr24feed
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: containers/adsb/fr24feed/Containerfile
      - name: hadolint status
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: containers/adsb/status/Containerfile

  tests:
    name: Python test suites (T044 — recorded-replay tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Contract tests (offline subset skips live checks)
        run: python3 -m unittest discover -s tests/contract -v
      - name: Build readsb image for recorded replay (amd64 OK — source-built decoder)
        run: podman build -t ghcr.io/tempest-concorde/fw-adsb-readsb:test \
               -f containers/adsb/readsb/Containerfile .
      - name: Integration tests (recorded BEAST replay + streams)
        run: python3 -m unittest discover -s tests/integration -v
