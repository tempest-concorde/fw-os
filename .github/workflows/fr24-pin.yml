name: Pin fr24feed Version

# Manual pin/update helper for the FR24 feed binary (fw-gsd
# specs/004-fedora-version-alignment, T020). Downloads the tarball at
# FR24_FEED_URL from containers/adsb/versions.env, computes its SHA256, pins
# FR24_FEED_VERSION / FR24_FEED_SHA256 plus a recorded_date line, and pushes
# the bump back to the branch it was dispatched on.
# dispatch with run branch feat/adsb-feeder until 003 lands on main.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pin-fr24feed:
    name: Pin fr24feed version + sha256 in versions.env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Resolve FR24 arm64 package from the APT index, update versions.env
        run: |
          set -euo pipefail
          env_file="containers/adsb/versions.env"

          python3 - <<'PYEOF'
          import gzip, hashlib, re, sys, traceback, urllib.request
          from datetime import date

          HOST = "https://repo-feed.flightradar24.com"
          SUITE = "raspberrypi-stable"
          ARCH = "arm64"

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          UA = "curl/8.5.0"  # vendor CDN rejects python's default UA (403)

          def get(url, timeout):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              return urllib.request.urlopen(req, timeout=timeout).read()

          def main():
              url = f"{HOST}/dists/flightradar24/{SUITE}/binary-{ARCH}/Packages.gz"
              print(f"::notice::fetching {url}")
              body = get(url, 60)
              print(f"::notice::gz bytes={len(body)}")
              index = gzip.decompress(body).decode("utf-8", "replace")
              import base64 as _b64
              print("::notice::index_head=" + _b64.b64encode(index[:400].encode()).decode())

              stanzas = [st for st in index.split("\n\n")
                         if st.startswith("Package: fr24feed\n")]
              if not stanzas:
                  names = re.findall(r"^Package: (\S+)", index, re.M)[:20]
                  fail(f"fr24feed not in Packages index; have: {', '.join(names)}")
              fields = {}
              for line in stanzas[-1].splitlines():
                  k, _, v = line.partition(": ")
                  fields[k] = v
              for req in ("Version", "Filename", "SHA256"):
                  if req not in fields:
                      fail(f"no {req} in stanza: {fields}")

              url = f"{HOST}/{fields['Filename']}"
              print(f"::notice::downloading {url}")
              blob = get(url, 180)
              digest = hashlib.sha256(blob).hexdigest()
              if digest != fields["SHA256"]:
                  fail(f"sha {digest} != index {fields['SHA256']}")
              return fields["Version"], url, digest

          try:
              version, url, digest = main()
          except SystemExit:
              raise
          except Exception:
              trace = traceback.format_exc()[-1200:]
              trace = trace.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error::resolve exception: " + trace)
              raise SystemExit(1)

          env_file = "containers/adsb/versions.env"
          import pathlib
          text = pathlib.Path(env_file).read_text()
          text = re.sub(r"(?m)^FR24_FEED_VERSION=.*$", f"FR24_FEED_VERSION={version}", text)
          text = re.sub(r"(?m)^FR24_FEED_SHA256=.*$", f"FR24_FEED_SHA256={digest}", text)
          text = re.sub(r"(?m)^FR24_FEED_URL=.*$", f"FR24_FEED_URL={url}", text)
          today = date.today().isoformat()
          if "# recorded_date: " in text:
              text = re.sub(r"(?m)^# recorded_date: .*$", f"# recorded_date: {today}", text)
          else:
              text = text.replace(f"FR24_FEED_SHA256={digest}",
                                  f"FR24_FEED_SHA256={digest}\n# recorded_date: {today}")
          pathlib.Path(env_file).write_text(text)
          print(f"::notice::pinned fr24feed {version}")
          PYEOF

          git diff -- "${env_file}"

      - name: Commit, push branch, and open/update the pin PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add containers/adsb/versions.env
          if git diff --cached --quiet; then
            echo "::notice::versions.env already pinned — nothing to commit"
            exit 0
          fi
          # github-actions[bot] cannot push to protected main: open a PR.
          BRANCH="chore/fr24-pin-$(date -u +%Y%m%d)"
          git checkout -B "${BRANCH}"
          VERSION=$(grep '^FR24_FEED_VERSION=' containers/adsb/versions.env | cut -d= -f2)
          git commit -m "chore(adsb): pin fr24feed ${VERSION} (version+sha256, FW-GSD 003 T043)" \
            || { echo "::error::commit step failed"; exit 1; }
          git push --force-with-lease -u origin "${BRANCH}" > /tmp/push.log 2>&1 \
            || { echo "::error::push failed::payload=$(tail -c 1500 /tmp/push.log | base64 -w0)"; exit 1; }
          gh pr create \
            --repo tempest-concorde/fw-os \
            --title "chore(adsb): pin fr24feed ${VERSION} (T043)" \
            --body "Automated fr24-pin resolution: packages resolved from the FR24 APT index (raspberrypi-stable/binary-arm64), download verified against the upstream SHA256, versions.env updated. Fills 003 T043 / unblocks the release-time fr24feed build." \
            --base main --head "${BRANCH}" > /tmp/pr.log 2>&1 \
          || { echo "::error::pr-create failed::payload=$(cat /tmp/pr.log | base64 -w0)"; exit 1; }
