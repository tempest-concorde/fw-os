name: Pin fr24feed Version

# Manual pin/update helper for the FR24 feed binary (fw-gsd
# specs/004-fedora-version-alignment, T020). Downloads the tarball at
# FR24_FEED_URL from containers/adsb/versions.env, computes its SHA256, pins
# FR24_FEED_VERSION / FR24_FEED_SHA256 plus a recorded_date line, and pushes
# the bump back to the branch it was dispatched on.
# dispatch with run branch feat/adsb-feeder until 003 lands on main.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin-fr24feed:
    name: Pin fr24feed version + sha256 in versions.env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Resolve FR24 arm64 package from the APT index, update versions.env
        run: |
          set -euo pipefail
          env_file="containers/adsb/versions.env"

          python3 - <<'PYEOF'
          import gzip, hashlib, json, re, sys, urllib.request
          from datetime import date

          HOST = "https://repo-feed.flightradar24.com"
          preset = {
              "suite": "linux-stable",
              "arch": "arm64",
              "package": "fr24feed",
          }

          url = f"{HOST}/dists/flightradar24/{preset['suite']}/binary-{preset['arch']}/Packages.gz"
          print(f"::notice::fetching {url}")
          body = urllib.request.urlopen(url, timeout=60).read()
          index = gzip.decompress(body).decode("utf-8", "replace")

          stanzas = [s for s in index.split("\n\n")
                     if s.startswith(f"Package: {preset['package']}\n")]
          if not stanzas:
              names = re.findall(r"^Package: (\S+)", index, re.M)[:20]
              print("::error::%s not found in Packages index; got: %s"
                    % (preset["package"], ", ".join(names)))
              sys.exit(1)

          fields = {}
          for line in stanzas[-1].splitlines():
              k, _, v = line.partition(": ")
              fields[k] = v
          for req in ("Version", "Filename", "SHA256"):
              if req not in fields:
                  print(f"::error::Packages entry lacks {req}: {fields}")
                  sys.exit(1)

          url = f"{HOST}/{fields['Filename']}"
          print(f"::notice::downloading {url}")
          blob = urllib.request.urlopen(url, timeout=120).read()
          digest = hashlib.sha256(blob).hexdigest()
          if digest != fields["SHA256"]:
              print(f"::error::download sha {digest} != index {fields['SHA256']}")
              sys.exit(1)

          env_file = "containers/adsb/versions.env"
          text = open(env_file).read()
          text = re.sub(r"(?m)^FR24_FEED_VERSION=.*$",
                        f"FR24_FEED_VERSION={fields['Version']}", text)
          text = re.sub(r"(?m)^FR24_FEED_SHA256=.*$",
                        f"FR24_FEED_SHA256={fields['SHA256']}", text)
          text = re.sub(r"(?m)^FR24_FEED_URL=.*$",
                        f"FR24_FEED_URL={url}", text)
          today = date.today().isoformat()
          if "# recorded_date: " in text:
              text = re.sub(r"(?m)^# recorded_date: .*$",
                            f"# recorded_date: {today}", text)
          else:
              text = text.replace(
                  f"FR24_FEED_SHA256={fields['SHA256']}",
                  f"FR24_FEED_SHA256={fields['SHA256']}\n# recorded_date: {today}")
          open(env_file, "w").write(text)
          print(f"::notice::pinned fr24feed {fields['Version']}")
          PYEOF

          git diff -- "${env_file}"

      - name: Commit and push the pin
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add containers/adsb/versions.env
          if git diff --cached --quiet; then
            echo "versions.env already pinned at this version/sha256 — nothing to commit"
            exit 0
          fi
          git commit -m "chore(adsb): pin fr24feed version+sha256"
          git push origin "HEAD:${GITHUB_REF_NAME}"
