name: Pin fr24feed Version

# Manual pin/update helper for the FR24 feed binary (fw-gsd
# specs/004-fedora-version-alignment, T020). Downloads the tarball at
# FR24_FEED_URL from containers/adsb/versions.env, computes its SHA256, pins
# FR24_FEED_VERSION / FR24_FEED_SHA256 plus a recorded_date line, and pushes
# the bump back to the branch it was dispatched on.
# dispatch with run branch feat/adsb-feeder until 003 lands on main.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin-fr24feed:
    name: Pin fr24feed version + sha256 in versions.env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Resolve FR24 arm64 package from the APT index, update versions.env
        run: |
          set -euo pipefail
          env_file="containers/adsb/versions.env"

          # FR24's feed repo (repo-feed.flightradar24.com, an S3 bucket) is an
          # APT repository: dists/flightradar24/<suite>/binary-<arch>/Packages.
          # linux_fr24feed_packages/*.tgz was RETIRED upstream (2026-10-08 —
          # keys no longer exist). The Packages index carries Filename +
          # SHA256, giving us the official integrity pin directly.
          SUITE=linux-stable
          ARCH=arm64
          # The plain /Packages key is a 200-zero-length anomaly on this
          # S3-hosted repo — fetch Packages.gz directly.
          CODE="$(curl -sSL -o /tmp/Packages.gz -w '%{http_code}' \
            "https://repo-feed.flightradar24.com/dists/flightradar24/${SUITE}/binary-${ARCH}/Packages.gz" || true)"
          echo "::notice::Packages.gz http_code=${CODE}"
          [ "${CODE}" = "200" ] || { echo "::error::Packages.gz unreachable rc=${CODE}"; exit 1; }
          zcat /tmp/Packages.gz > /tmp/Packages

          pkgs="$(grep '^Package: ' /tmp/Packages | awk '{print $2}' | tr '\n' ' ')"
          echo "::notice::packages in index: ${pkgs}"
          metadata="$(python3 - <<'PYEOF'
          import re, sys
          text = open('/tmp/Packages').read()
          stanzas = [st for st in text.split('\n\n') if st.startswith('Package: fr24feed')]
          if not stanzas:
              print('NOTFOUND')
              sys.exit(0)
          fields = {}
          for line in stanzas[-1].splitlines():
              k, _, v = line.partition(': ')
              fields[k] = v
          print('OK\n%s\n%s\n%s' % (fields['Version'], fields['Filename'], fields['SHA256']))
          PYEOF
          )"
          echo "::notice::metadata=$(printf '%s' "${metadata}" | head -c 400)"
          case "${metadata}" in OK*) ;; *)
            echo "::error::fr24feed not in Packages index: ${metadata}"; exit 1;;
          esac
          version="$(printf '%s' "${metadata}" | sed -n '2p')"
          filename="$(printf '%s' "${metadata}" | sed -n '3p')"
          sha256="$(printf '%s' "${metadata}" | sed -n '4p')"
          url="https://repo-feed.flightradar24.com/${filename}"
          printf '%s' "${sha256}" | grep -qE '^[0-9a-f]{64}$' \
            || { echo "::error::no usable upstream sha256 in Packages entry"; exit 1; }

          # Verify the download actually matches the index checksum.
          CODE="$(curl -sSL -o /tmp/fr24feed.deb -w '%{http_code}' "${url}" || true)"
          [ "${CODE}" = "200" ] \
            || { echo "::error::artifact rc=${CODE} url=${url}"; exit 1; }
          actual="$(sha256sum /tmp/fr24feed.deb | awk '{print $1}')"
          [ "${actual}" = "${sha256}" ] \
            || { echo "::error::downloaded sha ${actual} != index sha ${sha256}"; exit 1; }
          recorded="$(date -u +%F)"
          echo "Resolved fr24feed ${version} (${url})"

          sed -i "s|^FR24_FEED_VERSION=.*|FR24_FEED_VERSION=${version}|" "${env_file}"
          sed -i "s|^FR24_FEED_SHA256=.*|FR24_FEED_SHA256=${sha256}|" "${env_file}"
          sed -i "s|^FR24_FEED_URL=.*|FR24_FEED_URL=${url}|" "${env_file}"
          if grep -q '^# recorded_date: ' "${env_file}"; then
            sed -i "s|^# recorded_date: .*|# recorded_date: ${recorded}|" "${env_file}"
          else
            sed -i "s|^FR24_FEED_SHA256=.*|FR24_FEED_SHA256=${sha256}\n# recorded_date: ${recorded}|" "${env_file}"
          fi

          git diff -- "${env_file}"

      - name: Commit and push the pin
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add containers/adsb/versions.env
          if git diff --cached --quiet; then
            echo "versions.env already pinned at this version/sha256 — nothing to commit"
            exit 0
          fi
          git commit -m "chore(adsb): pin fr24feed version+sha256"
          git push origin "HEAD:${GITHUB_REF_NAME}"
