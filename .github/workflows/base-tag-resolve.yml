name: Base Tag Resolve

# Dispatch-driven re-pin of the fedora-bootc-pi base in the root Containerfile
# (fw-gsd specs/004-fedora-version-alignment, W2). Same pattern as
# fedora-bootc-pi's base-digest-resolve.yml: Dependabot's weekly cadence is
# too slow for alignment waves and ghcr digest resolution needs a connected
# runner. Gives the new base a `tag@sha256` pair and opens nothing itself —
# it pushes a branch; the caller opens the PR.
#
#   tag:    fedora-bootc-pi release to target, e.g. 4.1.0 (no leading v)
#   branch: new branch to create-or-reset from main and push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'fedora-bootc-pi release tag to rebase on (e.g. 4.1.0)'
        required: true
        type: string
      branch:
        description: 'Branch to create-or-reset from main and push'
        required: true
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: Resolve digest for ghcr.io/tempest-concorde/fedora-bootc-pi
        id: base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMG="ghcr.io/tempest-concorde/fedora-bootc-pi:${{ inputs.tag }}"
          export WANT="${{ inputs.tag }}"

          # curl-only ghcr resolver. Failures surface as base64 check
          # annotations (plain step output isn't REST-readable).
          TOKEN="$(curl -fsSL \
            -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:tempest-concorde/fedora-bootc-pi:pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')" \
            || { echo "::error::ghcr token exchange failed"; exit 1; }

          curl -fsSL \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/tempest-concorde/fedora-bootc-pi/tags/list" \
            -o /tmp/tags.json \
            || { echo "::error::tags/list failed (auth or network)"; exit 1; }

          # Release tags may carry a leading v; resolve the real tag name.
          TAG="$(python3 -c "import json,os; want=os.environ['WANT'].lstrip('v'); matches=[t for t in json.load(open('/tmp/tags.json'))['tags'] if t==want or t.lstrip('v')==want]; print(matches[0] if matches else '')")"
          [ -n "${TAG}" ] \
            || { echo "::error::tag '${WANT}' not found in ghcr tags::payload=$(cat /tmp/tags.json | base64 -w0)"; exit 1; }

          CODE="$(curl -sSL -D /tmp/hdr -o /tmp/manifest.json \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            -w '%{http_code}' \
            "https://ghcr.io/v2/tempest-concorde/fedora-bootc-pi/manifests/${TAG}")"
          [ "${CODE}" = "200" ] \
            || { echo "::error::manifest GET ${TAG} http=${CODE}::payload=$(tail -c 2000 /tmp/manifest.json 2>/dev/null | base64 -w0)"; exit 1; }

          RAW="$(awk -F': ' 'tolower($1)=="docker-content-digest" {print $2}' /tmp/hdr | tr -d '\r')"
          DIGEST="${RAW#sha256:}"
          printf '%s' "${DIGEST}" | grep -qE '^[0-9a-f]{64}$' \
            || { echo "::error::malformed digest '${DIGEST}'::payload=$(tail -c 1500 /tmp/hdr | base64 -w0)"; exit 1; }

          echo "digest=${DIGEST}" | tee -a "$GITHUB_OUTPUT"
          echo "Resolved ${IMG} -> ${DIGEST}"

      - name: Update Containerfile base tag+digest
        env:
          DIGEST: ${{ steps.base.outputs.digest }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sed -i "s|^FROM ghcr.io/tempest-concorde/fedora-bootc-pi:[^[:space:]]*@sha256:[0-9a-f]\{64\}|FROM ghcr.io/tempest-concorde/fedora-bootc-pi:${TAG}@sha256:${DIGEST}|" Containerfile
          grep '^FROM ' Containerfile

      - name: Commit and push branch
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          # Stop stale era-specific comment drift; canonical dataset lives in
          # fw-gsd FEDORA-BASELINE.md.
          sed -i "s|^# fedora-bootc-pi rebuilds the .* tag (new digest).*release .*\.|# Fedora 46 base — aligned with FEDORA-BASELINE.md (fw-gsd 004).|" Containerfile || true
          git diff --quiet Containerfile && { echo "no change detected — Containerfile already on target"; exit 0; }
          git add Containerfile
          git commit -m "chore(deps): rebase fw-os on fedora-bootc-pi ${{ inputs.tag }} (F46)

          fw-gsd specs/004-fedora-version-alignment W2."
          git push -u origin "${BRANCH}"
