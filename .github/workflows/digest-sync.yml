name: Digest Sync

on:
  pull_request:
    branches: [main]

jobs:
  # Keep the fw-app quadlet Image= lines in sync with the Containerfile.fw-app
  # sentinel. Dependabot tracks the sentinel's FROM line; when it opens a PR
  # bumping the fw-app digest, update mode rewrites the quadlet units in the
  # same PR. Every other PR runs check mode to enforce the invariant.
  update:
    name: Sync quadlet digests (Dependabot PR)
    if: github.actor == 'dependabot[bot]'
    uses: tempest-concorde/fw-cicd/.github/workflows/digest-sync.yml@main
    with:
      mode: update
      sentinel_file: Containerfile.fw-app
      quadlet_files: fw-app.container fw-app.image
    permissions:
      contents: write

  check:
    name: Verify quadlet digests match sentinel
    if: github.actor != 'dependabot[bot]'
    uses: tempest-concorde/fw-cicd/.github/workflows/digest-sync.yml@main
    with:
      mode: check
      sentinel_file: Containerfile.fw-app
      quadlet_files: fw-app.container fw-app.image
    permissions:
      contents: write

  # -----------------------------------------------------------------
  # ADS-B feed quadlets (fw-gsd specs/003-usb-adsb-feeder, T049).
  # Update mode only for now: the sentinel references start as digest
  # placeholders until the first fw-os release publishes the fw-adsb-*
  # images, and check-mode's manifest-resolution step would falsely fail
  # until then. Activation of the adsb check-mode jobs is part of the
  # T035 first-release verification task.
  # -----------------------------------------------------------------
  check-adsb-readsb:
    name: Verify adsb readsb digests match sentinel
    if: github.actor != 'dependabot[bot]'
    uses: tempest-concorde/fw-cicd/.github/workflows/digest-sync.yml@main
    with:
      mode: check
      sentinel_file: Containerfile.adsb-readsb
      quadlet_files: fw-adsb-readsb.container
    permissions:
      contents: write

  check-adsb-fr24feed:
    name: Verify adsb fr24feed digests match sentinel
    if: github.actor != 'dependabot[bot]'
    uses: tempest-concorde/fw-cicd/.github/workflows/digest-sync.yml@main
    with:
      mode: check
      sentinel_file: Containerfile.adsb-fr24feed
      quadlet_files: fw-adsb-fr24feed.container
    permissions:
      contents: write

  check-adsb-status:
    name: Verify adsb status digests match sentinel
    if: github.actor != 'dependabot[bot]'
    uses: tempest-concorde/fw-cicd/.github/workflows/digest-sync.yml@main
    with:
      mode: check
      sentinel_file: Containerfile.adsb-status
      quadlet_files: fw-adsb-status.container
    permissions:
      contents: write
  update-adsb-readsb:
    name: Sync adsb readsb digest (Dependabot PR)
    if: github.actor == 'dependabot[bot]'
    uses: tempest-concorde/fw-cicd/.github/workflows/digest-sync.yml@main
    with:
      mode: update
      sentinel_file: Containerfile.adsb-readsb
      quadlet_files: fw-adsb-readsb.container
    permissions:
      contents: write

  update-adsb-fr24feed:
    name: Sync adsb fr24feed digest (Dependabot PR)
    if: github.actor == 'dependabot[bot]'
    uses: tempest-concorde/fw-cicd/.github/workflows/digest-sync.yml@main
    with:
      mode: update
      sentinel_file: Containerfile.adsb-fr24feed
      quadlet_files: fw-adsb-fr24feed.container
    permissions:
      contents: write

  update-adsb-status:
    name: Sync adsb status digest (Dependabot PR)
    if: github.actor == 'dependabot[bot]'
    uses: tempest-concorde/fw-cicd/.github/workflows/digest-sync.yml@main
    with:
      mode: update
      sentinel_file: Containerfile.adsb-status
      quadlet_files: fw-adsb-status.container
    permissions:
      contents: write