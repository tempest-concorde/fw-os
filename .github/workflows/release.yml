name: Release

on:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 8:07am UTC — 2h after fedora-bootc-pi cron (6:07am)
    # Offset from :00 to reduce GitHub Actions queue delays
    - cron: '7 8 * * 1'
  repository_dispatch:
    types: [base-image-updated]
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    uses: tempest-concorde/fw-cicd/.github/workflows/semantic-release.yml@main
    with:
      use_local_config: false
    secrets: inherit

  build:
    name: Build and push bootc image
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: tempest-concorde/fw-cicd/.github/workflows/build-bootc.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-os
      platform: linux/arm64
      containerfile: Containerfile
      push: true
      tags: ${{ needs.release.outputs.new_release_version }} latest
    secrets: inherit

  sign:
    name: Sign bootc image
    needs: [release, build]
    if: needs.release.outputs.new_release_published == 'true'
    uses: tempest-concorde/fw-cicd/.github/workflows/cosign-sign-verify.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-os
      image_digest: ${{ needs.build.outputs.digest }}
      version: ${{ needs.release.outputs.new_release_version }}
      signing_mode: key
    secrets: inherit

  # -------------------------------------------------------------------------
  # ADS-B feed service images (fw-gsd specs/003-usb-adsb-feeder, T003/T035)
  # Same release tag as the OS image; SBOM-attested + cosign-signed per image.
  # -------------------------------------------------------------------------

  build-adsb-readsb:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: tempest-concorde/fw-cicd/.github/workflows/build-container.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-readsb
      platform: linux/arm64
      containerfile: containers/adsb/readsb/Containerfile
      push: true
      tags: ${{ needs.release.outputs.new_release_version }} latest
    secrets: inherit

  # Single source of pinned upstream versions for release-time gating. The
  # fr24feed image build hard-fails while FR24_FEED_SHA256=PENDING (vendor
  # integrity guardrail, fw-gsd 003 T043): these jobs skip until the
  # fr24-pin workflow pins the checksum on a connected runner.
  adsb-versions:
    name: Read adsb pinned versions
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    outputs:
      fr24_feed_sha256: ${{ steps.read.outputs.fr24_feed_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: read
        run: |
          set -a; . containers/adsb/versions.env; set +a
          echo "fr24_feed_sha256=${FR24_FEED_SHA256}" >> "$GITHUB_OUTPUT"

  build-adsb-fr24feed:
    needs: [release, adsb-versions]
    if: needs.release.outputs.new_release_published == 'true' && needs.adsb-versions.outputs.fr24_feed_sha256 != 'PENDING'
    uses: tempest-concorde/fw-cicd/.github/workflows/build-container.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-fr24feed
      platform: linux/arm64
      containerfile: containers/adsb/fr24feed/Containerfile
      push: true
      tags: ${{ needs.release.outputs.new_release_version }} latest
    secrets: inherit

  build-adsb-status:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: tempest-concorde/fw-cicd/.github/workflows/build-container.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-status
      platform: linux/arm64
      containerfile: containers/adsb/status/Containerfile
      push: true
      tags: ${{ needs.release.outputs.new_release_version }} latest
    secrets: inherit

  sign-adsb-readsb:
    needs: [release, build-adsb-readsb]
    if: needs.release.outputs.new_release_published == 'true'
    uses: tempest-concorde/fw-cicd/.github/workflows/cosign-sign-verify.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-readsb
      image_digest: ${{ needs.build-adsb-readsb.outputs.digest }}
      version: ${{ needs.release.outputs.new_release_version }}
      signing_mode: key
    secrets: inherit

  sign-adsb-fr24feed:
    needs: [release, adsb-versions, build-adsb-fr24feed]
    if: needs.release.outputs.new_release_published == 'true' && needs.adsb-versions.outputs.fr24_feed_sha256 != 'PENDING'
    uses: tempest-concorde/fw-cicd/.github/workflows/cosign-sign-verify.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-fr24feed
      image_digest: ${{ needs.build-adsb-fr24feed.outputs.digest }}
      version: ${{ needs.release.outputs.new_release_version }}
      signing_mode: key
    secrets: inherit

  sign-adsb-status:
    needs: [release, build-adsb-status]
    if: needs.release.outputs.new_release_published == 'true'
    uses: tempest-concorde/fw-cicd/.github/workflows/cosign-sign-verify.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-status
      image_digest: ${{ needs.build-adsb-status.outputs.digest }}
      version: ${{ needs.release.outputs.new_release_version }}
      signing_mode: key
    secrets: inherit

  sbom-adsb-readsb:
    needs: [release, build-adsb-readsb]
    if: needs.release.outputs.new_release_published == 'true'
    uses: tempest-concorde/fw-cicd/.github/workflows/sbom-attest.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-readsb
      image_digest: ${{ needs.build-adsb-readsb.outputs.digest }}
      signing_mode: key
    secrets: inherit

  sbom-adsb-fr24feed:
    needs: [release, adsb-versions, build-adsb-fr24feed]
    if: needs.release.outputs.new_release_published == 'true' && needs.adsb-versions.outputs.fr24_feed_sha256 != 'PENDING'
    uses: tempest-concorde/fw-cicd/.github/workflows/sbom-attest.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-fr24feed
      image_digest: ${{ needs.build-adsb-fr24feed.outputs.digest }}
      signing_mode: key
    secrets: inherit

  sbom-adsb-status:
    needs: [release, build-adsb-status]
    if: needs.release.outputs.new_release_published == 'true'
    uses: tempest-concorde/fw-cicd/.github/workflows/sbom-attest.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fw-adsb-status
      image_digest: ${{ needs.build-adsb-status.outputs.digest }}
      signing_mode: key
    secrets: inherit
